name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: the Gradle wrapper is the one Gradle published
        run: bash tools/check-wrapper.sh
      - name: translations match English
        run: python3 tools/strings.py check app/src/main/res
      - name: the network has one door, and it goes through the proxy
        run: bash tools/check-network-doors.sh
      - name: every other way to the network fails that check
        run: bash tools/tests/network-doors/run.sh
      - name: core tests
        run: ./gradlew --no-daemon :core:test
      - name: the page of the handoff seals what the device opens
        run: bash tools/check-handoff-page.sh --no-browser
      - name: the add page takes only https addresses and encodes what it passes on
        run: node tools/check-site.js
      - name: app unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: release build
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: lint finds no error in the release build
        run: ./gradlew --no-daemon :app:lintRelease
      - name: no call to a Java method the oldest supported Android lacks
        run: bash tools/check-java-api.sh
      - name: shipped apk keeps its promises
        run: bash tools/check-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: two builds in two folders give the same file
        run: bash tools/check-reproducible.sh "$RUNNER_TEMP/reproducible"

  device:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: the emulator may use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: the engine's device tests pass on Android 16
        run: bash tools/ci-emulator.sh
