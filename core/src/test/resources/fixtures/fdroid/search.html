<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>F-Droid - Free and Open Source Android App Repository</title>
</head>
<body>
  <div class="site-wrapper">
    <div class="main-content">
      <div class="container">
        <div class="search-form">
          <form action="/" method="get">
            <input type="text" class="search-input" name="q" value="notes" />
              <input type="hidden" name="lang" value="en" />
            <input type="submit" value="search" class="material-button" />
          </form>
        </div>

          <a class="package-header" href="https://f-droid.org/en/packages/org.example.notes">
            <img class="package-icon" src="https://f-droid.org/repo/org.example.notes/en-US/icon.png" />

            <div class="package-info">
              <h4 class="package-name">
                Example Notes
              </h4>

              <div class="package-desc">
                <span class="package-summary">Notes that stay on the phone &amp; sync</span><span class="package-license">GPL-3.0-only</span>
              </div>
            </div>
          </a>

          <a class="package-header" href="https://f-droid.org/de/packages/org.example.player/">
            <img class="package-icon" src="https://f-droid.org/repo/org.example.player/en-US/icon.png" />

            <div class="package-info">
              <h4 class="package-name">
                Example Player
              </h4>

              <div class="package-desc">
                <span class="package-license">Apache-2.0</span>
              </div>
            </div>
          </a>

          <a class="package-header" href="https://f-droid.org/packages/org.example.notes">
            <div class="package-info">
              <h4 class="package-name">Example Notes (again)</h4>
            </div>
          </a>

          <a class="package-header" href="https://example.org/packages/org.example.fake">
            <div class="package-info">
              <h4 class="package-name">Fake Example</h4>
              <div class="package-desc"><span class="package-summary">Somewhere else</span></div>
            </div>
          </a>

          <a class="package-header" href="https://f-droid.org/en/packages/notapackage">
            <div class="package-info">
              <h4 class="package-name">Not A Package</h4>
            </div>
          </a>

          <a class="package-header" href="https://f-droid.org/en/packages/org.example.maps">
            <div class="package-info">
              <h4 class="package-name">
                Example <b>Maps</b>
              </h4>
              <div class="package-desc">
                <span class="package-summary">Maps for walking,
                  kept on the phone</span><span class="package-license">MIT</span>
              </div>
            </div>
          </a>

        <ul class="browse-navigation">
          <li class="nav current"><a class="label" href="/?q=notes&amp;lang=en&amp;page=1">1</a></li>
          <li class="nav"><a class="label" href="/?q=notes&amp;lang=en&amp;page=2">2</a></li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
